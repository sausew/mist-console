<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa544"/>
      <stop offset="1" stop-color="#2c6a2c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- main stem creeping in from the corner -->
  <path d="M-6 4 C 58 22 40 84 96 102 C 152 120 150 182 130 244"
        stroke="#346a2b" stroke-width="3.6" stroke-linecap="round"/>
  <!-- a branch -->
  <path d="M96 102 C 120 96 138 70 134 44" stroke="#346a2b" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="url(#leaf)" stroke="#27602a" stroke-width="1">
    <path d="M36 22 C 58 6 86 12 96 32 C 74 42 48 40 36 22 Z"/>
    <path d="M62 70 C 46 48 52 22 74 14 C 84 38 80 60 62 70 Z"/>
    <path d="M96 102 C 122 90 146 98 156 118 C 132 128 108 124 96 102 Z"/>
    <path d="M134 44 C 150 28 174 30 184 46 C 166 58 144 58 134 44 Z"/>
    <path d="M118 152 C 102 130 108 104 130 96 C 142 120 136 142 118 152 Z"/>
    <path d="M126 200 C 150 190 172 200 180 220 C 156 228 134 222 126 200 Z"/>
  </g>
  <!-- tendril curl at the growing tip -->
  <path d="M130 244 c 16 -12 9 -30 -7 -25 c -11 4 -7 19 5 14"
        stroke="#346a2b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- glowing arcane blossoms -->
  <g filter="url(#glow)">
    <circle cx="96" cy="32" r="5" fill="#2f9bff"/>
    <circle cx="156" cy="118" r="4.4" fill="#2f9bff"/>
    <circle cx="184" cy="46" r="3.6" fill="#7fc4ff"/>
  </g>
</svg>
