<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 540" fill="none" preserveAspectRatio="xMidYMin meet">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc070"/><stop offset="1" stop-color="#1d7a40"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79d28a"/><stop offset="1" stop-color="#24884a"/>
    </linearGradient>
    <filter id="sglow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- detailed tropical hibiscus: ruffled veined petals, dark throat, protruding
         stamen with anthers. Petal colour = currentColor on each use. -->
    <g id="fl">
      <g fill="currentColor" stroke="rgba(0,0,0,.34)" stroke-width=".7" stroke-linejoin="round">
        <path d="M0 -1 C -7 -6 -9 -13 -6 -18 C -3 -21 -1.5 -19 0 -16 C 1.5 -19 3 -21 6 -18 C 9 -13 7 -6 0 -1 Z"/>
        <path d="M0 -1 C -7 -6 -9 -13 -6 -18 C -3 -21 -1.5 -19 0 -16 C 1.5 -19 3 -21 6 -18 C 9 -13 7 -6 0 -1 Z" transform="rotate(72)"/>
        <path d="M0 -1 C -7 -6 -9 -13 -6 -18 C -3 -21 -1.5 -19 0 -16 C 1.5 -19 3 -21 6 -18 C 9 -13 7 -6 0 -1 Z" transform="rotate(144)"/>
        <path d="M0 -1 C -7 -6 -9 -13 -6 -18 C -3 -21 -1.5 -19 0 -16 C 1.5 -19 3 -21 6 -18 C 9 -13 7 -6 0 -1 Z" transform="rotate(216)"/>
        <path d="M0 -1 C -7 -6 -9 -13 -6 -18 C -3 -21 -1.5 -19 0 -16 C 1.5 -19 3 -21 6 -18 C 9 -13 7 -6 0 -1 Z" transform="rotate(288)"/>
      </g>
      <g stroke="rgba(0,0,0,.28)" stroke-width=".7" fill="none" stroke-linecap="round">
        <path d="M0 -2 L0 -15"/><path d="M0 -2 L0 -15" transform="rotate(72)"/>
        <path d="M0 -2 L0 -15" transform="rotate(144)"/><path d="M0 -2 L0 -15" transform="rotate(216)"/>
        <path d="M0 -2 L0 -15" transform="rotate(288)"/>
      </g>
      <circle r="4.2" fill="rgba(0,0,0,.36)"/>
      <path d="M0 0 C 4 -11 6 -20 5 -26" stroke="#ffe9a0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <g fill="#ffce3a" stroke="rgba(110,40,0,.6)" stroke-width=".4">
        <circle cx="5" cy="-26" r="1.9"/><circle cx="2" cy="-25" r="1.5"/>
        <circle cx="8" cy="-24" r="1.5"/><circle cx="4" cy="-29" r="1.4"/>
      </g>
    </g>
    <!-- spiky exotic starflower: double row of sharp petals, gold-and-dark eye -->
    <g id="fl2">
      <g fill="currentColor" stroke="rgba(0,0,0,.32)" stroke-width=".5" stroke-linejoin="round">
        <path d="M0 0 L-2.6 -11 L0 -20 L2.6 -11 Z"/>
        <path d="M0 0 L-2.6 -11 L0 -20 L2.6 -11 Z" transform="rotate(51.43)"/>
        <path d="M0 0 L-2.6 -11 L0 -20 L2.6 -11 Z" transform="rotate(102.86)"/>
        <path d="M0 0 L-2.6 -11 L0 -20 L2.6 -11 Z" transform="rotate(154.29)"/>
        <path d="M0 0 L-2.6 -11 L0 -20 L2.6 -11 Z" transform="rotate(205.71)"/>
        <path d="M0 0 L-2.6 -11 L0 -20 L2.6 -11 Z" transform="rotate(257.14)"/>
        <path d="M0 0 L-2.6 -11 L0 -20 L2.6 -11 Z" transform="rotate(308.57)"/>
      </g>
      <g fill="rgba(0,0,0,.24)">
        <path d="M0 0 L-1.9 -6 L0 -13 L1.9 -6 Z" transform="rotate(25.7)"/>
        <path d="M0 0 L-1.9 -6 L0 -13 L1.9 -6 Z" transform="rotate(77.1)"/>
        <path d="M0 0 L-1.9 -6 L0 -13 L1.9 -6 Z" transform="rotate(128.6)"/>
        <path d="M0 0 L-1.9 -6 L0 -13 L1.9 -6 Z" transform="rotate(180)"/>
        <path d="M0 0 L-1.9 -6 L0 -13 L1.9 -6 Z" transform="rotate(231.4)"/>
        <path d="M0 0 L-1.9 -6 L0 -13 L1.9 -6 Z" transform="rotate(282.9)"/>
      </g>
      <circle r="3.4" fill="#ffce3a" stroke="rgba(110,40,0,.55)" stroke-width=".5"/>
      <circle r="1.4" fill="rgba(90,30,0,.7)"/>
    </g>
  </defs>

  <!-- winding stems + reaching branches (deep green) -->
  <g stroke="#1f6a34" fill="none" stroke-linecap="round">
    <path d="M140 -8 C 80 60 30 130 92 198 C 152 266 190 338 120 408 C 70 460 150 498 140 548" stroke-width="4.2"/>
    <path d="M140 -6 C 178 52 150 116 120 168" stroke-width="2.6"/>
    <path d="M92 198 C 60 196 30 210 14 232" stroke-width="2.3"/>
    <path d="M120 408 C 150 404 178 418 192 440" stroke-width="2.3"/>
    <path d="M110 96 C 140 92 168 104 182 126" stroke-width="2.1"/>
    <path d="M120 300 C 92 300 64 314 50 336" stroke-width="2.1"/>
    <path d="M150 250 C 168 246 178 250 186 256" stroke-width="1.3"/>
    <path d="M70 360 C 52 358 44 362 36 368" stroke-width="1.3"/>
  </g>

  <!-- leaves, varied -->
  <g stroke="#0e4a25" stroke-width="1">
    <path fill="url(#leaf)"  d="M92 198 C 70 184 44 190 34 212 C 58 224 84 220 92 198 Z"/>
    <path fill="url(#leaf2)" d="M120 168 C 138 146 132 118 110 108 C 100 132 104 156 120 168 Z"/>
    <path fill="url(#leaf)"  d="M182 126 C 200 110 198 86 178 78 C 168 100 168 116 182 126 Z"/>
    <path fill="url(#leaf2)" d="M50 132 C 30 122 10 132 6 154 C 28 162 46 152 50 132 Z"/>
    <path fill="url(#leaf)"  d="M120 300 C 138 280 134 252 112 244 C 102 268 106 290 120 300 Z"/>
    <path fill="url(#leaf2)" d="M50 336 C 30 328 12 340 10 362 C 32 368 48 356 50 336 Z"/>
    <path fill="url(#leaf)"  d="M120 408 C 102 388 108 360 130 352 C 140 376 136 398 120 408 Z"/>
    <path fill="url(#leaf2)" d="M192 440 C 200 416 188 396 166 396 C 162 420 176 436 192 440 Z"/>
    <path fill="url(#leaf)"  d="M150 470 C 168 450 164 422 142 414 C 132 438 136 460 150 470 Z"/>
    <path fill="url(#leaf2)" d="M70 460 C 52 440 58 414 80 408 C 90 430 84 452 70 460 Z"/>
    <path fill="url(#leaf)"  d="M158 300 C 178 292 196 304 196 326 C 174 332 158 320 158 300 Z"/>
  </g>

  <!-- bold tropical jungle flowers (hibiscus + spiky starflower) -->
  <g>
    <use href="#fl"  transform="translate(14,232) scale(1.15) rotate(-18)" style="color:#e0392b"/>
    <use href="#fl2" transform="translate(182,126) scale(1.0) rotate(12)" style="color:#ff7a14"/>
    <use href="#fl"  transform="translate(52,132) scale(.9) rotate(10)" style="color:#7b34c0"/>
    <use href="#fl2" transform="translate(192,440) scale(1.1) rotate(-10)" style="color:#f2a900"/>
    <use href="#fl"  transform="translate(50,336) scale(1.0) rotate(-8)" style="color:#c81f7a"/>
    <use href="#fl2" transform="translate(196,326) scale(.82) rotate(20)" style="color:#19b89a"/>
    <use href="#fl"  transform="translate(150,470) scale(.92) rotate(8)" style="color:#ff5e1f"/>
  </g>

  <!-- glowing blue arcane star sigils -->
  <g filter="url(#sglow)" fill="#36a3ff">
    <path transform="translate(188,256)" d="M0 -7 Q1.1 -1.1 7 0 Q1.1 1.1 0 7 Q-1.1 1.1 -7 0 Q-1.1 -1.1 0 -7 Z"/>
    <path transform="translate(36,368) scale(.85)" d="M0 -7 Q1.1 -1.1 7 0 Q1.1 1.1 0 7 Q-1.1 1.1 -7 0 Q-1.1 -1.1 0 -7 Z"/>
    <path transform="translate(120,30) scale(.7)" d="M0 -7 Q1.1 -1.1 7 0 Q1.1 1.1 0 7 Q-1.1 1.1 -7 0 Q-1.1 -1.1 0 -7 Z"/>
  </g>
</svg>
