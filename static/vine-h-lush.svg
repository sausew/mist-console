<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 96" fill="none" preserveAspectRatio="xMinYMid meet">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc070"/><stop offset="1" stop-color="#1d7a40"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79d28a"/><stop offset="1" stop-color="#24884a"/>
    </linearGradient>
    <filter id="sglow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="fl">
      <g fill="currentColor" stroke="rgba(0,0,0,.16)" stroke-width=".5">
        <ellipse cx="0" cy="-7.5" rx="4.2" ry="7.5"/>
        <ellipse cx="0" cy="-7.5" rx="4.2" ry="7.5" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7.5" rx="4.2" ry="7.5" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7.5" rx="4.2" ry="7.5" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7.5" rx="4.2" ry="7.5" transform="rotate(288)"/>
      </g>
      <circle r="3" fill="#ffe27a"/>
    </g>
  </defs>
  <!-- winding stem (seamless left->right) + pedicels -->
  <g stroke="#1f6a34" fill="none" stroke-linecap="round">
    <path d="M-10 58 C 70 84 120 30 200 58 C 280 86 330 30 410 58 C 490 84 540 30 620 58 C 650 70 660 58 660 58" stroke-width="3.6"/>
    <path d="M120 44 C 116 28 118 18 124 12" stroke-width="1.4"/>
    <path d="M330 44 C 334 28 332 18 326 12" stroke-width="1.4"/>
    <path d="M540 44 C 536 28 538 18 544 12" stroke-width="1.4"/>
    <path d="M250 70 C 248 80 250 86 254 92" stroke-width="1.3"/>
  </g>
  <!-- leaves -->
  <g stroke="#0e4a25" stroke-width="1">
    <path fill="url(#leaf)"  d="M64 58 C 54 36 66 22 84 22 C 88 44 80 58 64 58 Z"/>
    <path fill="url(#leaf2)" d="M200 58 C 190 80 202 94 220 94 C 224 72 216 58 200 58 Z"/>
    <path fill="url(#leaf)"  d="M280 58 C 270 36 282 22 300 22 C 304 44 296 58 280 58 Z"/>
    <path fill="url(#leaf2)" d="M410 58 C 400 80 412 94 430 94 C 434 72 426 58 410 58 Z"/>
    <path fill="url(#leaf)"  d="M470 58 C 460 36 472 22 490 22 C 494 44 486 58 470 58 Z"/>
    <path fill="url(#leaf2)" d="M600 58 C 590 80 602 94 620 94 C 624 72 616 58 600 58 Z"/>
  </g>
  <!-- colorful flowers along the top -->
  <g>
    <use href="#fl" transform="translate(124,12) scale(1.0)"  style="color:#e85a9c"/>
    <use href="#fl" transform="translate(326,12) scale(.95)"  style="color:#ff8a3d"/>
    <use href="#fl" transform="translate(544,12) scale(1.0)"  style="color:#b06cf0"/>
    <use href="#fl" transform="translate(40,30) scale(.85)"   style="color:#ffd24a"/>
    <use href="#fl" transform="translate(440,28) scale(.85)"  style="color:#5ad1c0"/>
    <use href="#fl" transform="translate(228,90) scale(.8)"   style="color:#ff9ecb"/>
  </g>
  <!-- glowing blue arcane sigils -->
  <g filter="url(#sglow)" fill="#36a3ff">
    <path transform="translate(254,92) scale(.8)" d="M0 -7 Q1.1 -1.1 7 0 Q1.1 1.1 0 7 Q-1.1 1.1 -7 0 Q-1.1 -1.1 0 -7 Z"/>
    <path transform="translate(490,30) scale(.7)" d="M0 -7 Q1.1 -1.1 7 0 Q1.1 1.1 0 7 Q-1.1 1.1 -7 0 Q-1.1 -1.1 0 -7 Z"/>
  </g>
</svg>
