<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#F3EEDD;font-family:sans-serif;color:#2E2A22;padding:16px;
       display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .cell{border:1px solid #CBD8C2;background:#FBF8EF;padding:8px}
  .cap{font-size:12px;margin-bottom:6px;color:#2F6B3C;font-weight:700}
  .art{height:220px;background:#2F6B3C;
       -webkit-mask-repeat:no-repeat;-webkit-mask-position:center;-webkit-mask-size:contain;
       mask-repeat:no-repeat;mask-position:center;mask-size:contain}
  .tile{height:220px;background:#4E7E52;
        -webkit-mask-repeat:repeat;-webkit-mask-size:160px;mask-repeat:repeat;mask-size:160px}
</style></head><body>
<div class="cell"><div class="cap">morris-venetian</div><div class="tile" style="-webkit-mask-image:url(morris-venetian.svg);mask-image:url(morris-venetian.svg)"></div></div>
<div class="cell"><div class="cap">an-corner</div><div class="art" style="-webkit-mask-image:url(an-corner.svg);mask-image:url(an-corner.svg)"></div></div>
<div class="cell"><div class="cap">an-ornament</div><div class="art" style="-webkit-mask-image:url(an-ornament.svg);mask-image:url(an-ornament.svg)"></div></div>
<div class="cell"><div class="cap">an-headpiece</div><div class="art" style="-webkit-mask-image:url(an-headpiece.svg);mask-image:url(an-headpiece.svg)"></div></div>
<div class="cell"><div class="cap">an-flourish</div><div class="art" style="-webkit-mask-image:url(an-flourish.svg);mask-image:url(an-flourish.svg)"></div></div>
<div class="cell"><div class="cap">an-tulip</div><div class="art" style="-webkit-mask-image:url(an-tulip.svg);mask-image:url(an-tulip.svg)"></div></div>
<div class="cell"><div class="cap">an-border-repeat</div><div class="art" style="-webkit-mask-image:url(an-border-repeat.svg);mask-image:url(an-border-repeat.svg)"></div></div>
</body></html>
